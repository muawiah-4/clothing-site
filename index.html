<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Atelier — a house of form and material. Ready-to-wear, considered."
    />
    <meta name="theme-color" content="#c9b6e8" />
    <!-- Hero LCP photo (FEATURED[0] in src/sections/Hero.tsx): open the
         connection and start the download before the JS arrives. The
         preconnect has no crossorigin attribute on purpose: the <img> is a
         no-cors request, and Chrome only reuses a preconnected socket for the
         same credentials mode. srcset/sizes must match the <img> exactly. -->
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link
      rel="preload"
      as="image"
      href="https://images.unsplash.com/photo-1608548936842-6765019f1c13?w=720&amp;q=80&amp;auto=format&amp;fit=crop"
      imagesrcset="https://images.unsplash.com/photo-1608548936842-6765019f1c13?w=360&amp;q=80&amp;auto=format&amp;fit=crop 360w, https://images.unsplash.com/photo-1608548936842-6765019f1c13?w=540&amp;q=80&amp;auto=format&amp;fit=crop 540w, https://images.unsplash.com/photo-1608548936842-6765019f1c13?w=720&amp;q=80&amp;auto=format&amp;fit=crop 720w, https://images.unsplash.com/photo-1608548936842-6765019f1c13?w=1080&amp;q=80&amp;auto=format&amp;fit=crop 1080w"
      imagesizes="(min-width: 640px) 360px, 78vw"
      fetchpriority="high"
      referrerpolicy="no-referrer"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
      referrerpolicy="no-referrer"
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Atelier" />
    <meta property="og:title" content="Atelier — Form in Material" />
    <meta
      property="og:description"
      content="Atelier — a house of form and material. Ready-to-wear, considered."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Atelier — Form in Material" />
    <meta
      name="twitter:description"
      content="Atelier — a house of form and material. Ready-to-wear, considered."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <title>Atelier — Form in Material</title>
  </head>
  <body>

  </body>
</html>
