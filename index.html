<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Atelier — Form in Material. Considered ready-to-wear for men and women, cut in Paris to outlast trend."
    />
    <meta name="theme-color" content="#c9b6e8" />
    <!-- Hero LCP photo (FEATURED[0] in src/sections/Hero.tsx): open the
         connection and start the download before the JS arrives. The
         preconnect has no crossorigin attribute on purpose: the <img> is a
         no-cors request, and Chrome only reuses a preconnected socket for the
         same credentials mode. srcset/sizes/quality must match the <img> exactly
         (HERO_WIDTHS / HERO_SIZES / HERO_QUALITY), or mobile downloads twice. -->
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link
      rel="preload"
      as="image"
      href="https://images.unsplash.com/photo-1553143820-6bb68bc34679?w=600&amp;q=60&amp;auto=format&amp;fit=crop"
      imagesrcset="https://images.unsplash.com/photo-1553143820-6bb68bc34679?w=400&amp;q=60&amp;auto=format&amp;fit=crop 400w, https://images.unsplash.com/photo-1553143820-6bb68bc34679?w=600&amp;q=60&amp;auto=format&amp;fit=crop 600w, https://images.unsplash.com/photo-1553143820-6bb68bc34679?w=800&amp;q=60&amp;auto=format&amp;fit=crop 800w, https://images.unsplash.com/photo-1553143820-6bb68bc34679?w=1080&amp;q=60&amp;auto=format&amp;fit=crop 1080w"
      imagesizes="(min-width: 640px) 360px, calc(78vw - 37px)"
      fetchpriority="high"
      referrerpolicy="no-referrer"
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Atelier" />
    <meta property="og:title" content="Atelier — Form in Material" />
    <meta
      property="og:description"
      content="Atelier — a house of form and material. Ready-to-wear, considered."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Atelier — Form in Material" />
    <meta
      name="twitter:description"
      content="Atelier — a house of form and material. Ready-to-wear, considered."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <title>Atelier — Form in Material</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
